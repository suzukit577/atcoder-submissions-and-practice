[project]
name = "atcoder-submissions-and-practice"
version = "0.1.0"
description = "AtCoder submissions and practice"
requires-python = ">=3.13"

dependencies = [
  "numpy>=2.2.1",
  "sortedcontainers>=2.4.0",
  "ac-library-python>=0.1.0"
]

[dependency-groups]
dev = [
  "ruff>=0.5.0",
  "mypy>=1.10.0"
]

# -----------------
# Ruff
# -----------------
[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

# -----------------
# mypy
# -----------------
[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
strict = false
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
